[package]
name = "antidote-desktop"
description = "Tauri host for the Antidote local research instrument"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lib]
name = "antidote_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
antidote-core = { path = "../../../crates/antidote-core" }
antidote-store = { path = "../../../crates/antidote-store" }
antidote-worker = { path = "../../../crates/antidote-worker" }
serde.workspace = true
serde_json.workspace = true
tauri = { workspace = true, features = ["protocol-asset"] }
time.workspace = true

[dev-dependencies]
tempfile = "=3.27.0"

[lints]
workspace = true
