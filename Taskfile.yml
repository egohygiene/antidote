# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

vars:
  PYTHON: '{{default "python3" .PYTHON}}'
  PROJECT: '{{default "auto" .PROJECT}}'
  THEME: '{{default "egohygiene" .THEME}}'
  BUILD_DIR: '{{default (printf "build/%s" .THEME) .BUILD_DIR}}'
  PREVIEW_HOST: '{{default "127.0.0.1" .PREVIEW_HOST}}'
  PREVIEW_PORT: '{{default "8000" .PREVIEW_PORT}}'
  HOLON_SOURCE: '{{default "" .HOLON_SOURCE}}'
  RUNNER: '{{.PYTHON}} scripts/tasks.py --project="{{.PROJECT}}" --build-dir="{{.BUILD_DIR}}" --theme="{{.THEME}}" --python="{{.PYTHON}}" --preview-host="{{.PREVIEW_HOST}}" --preview-port="{{.PREVIEW_PORT}}" --holon-source="{{.HOLON_SOURCE}}"'

tasks:
  default:
    desc: List research-paper tasks
    cmds:
      - task --list
    silent: true

  build:
    desc: Build PDF, accessible web, provenance, and arXiv source outputs
    aliases: [all]
    cmds:
      - '{{.RUNNER}} build'

  check:
    desc: Build, validate, and prove deterministic outputs
    cmds:
      - '{{.RUNNER}} check'

  check-all:
    desc: Validate neutral and Ego Hygiene projections
    cmds:
      - '{{.RUNNER}} check-all'

  check-content:
    desc: Build and validate source plus rendered artifacts
    cmds:
      - '{{.RUNNER}} check-content'

  check-links:
    desc: Build and include live external-link validation
    cmds:
      - '{{.RUNNER}} check-links'

  reproducibility:
    desc: Compare two clean governed artifact builds
    cmds:
      - '{{.RUNNER}} reproducibility'

  bootstrap-check:
    desc: Prove the Beacon profile emits a standalone project
    cmds:
      - '{{.RUNNER}} bootstrap-check'

  clean:
    desc: Remove the selected generated output directory
    cmds:
      - '{{.RUNNER}} clean'

  inventory:
    desc: Verify preserved Empathy migration evidence
    cmds:
      - '{{.RUNNER}} inventory'

  mvp:bootstrap:
    desc: Restore pinned Rust, Node, and Python MVP workspaces
    cmds:
      - '{{.RUNNER}} mvp-bootstrap'

  mvp:check:
    desc: Run the complete application-foundation quality gate
    cmds:
      - '{{.RUNNER}} mvp-check'

  mvp:contracts:
    desc: Regenerate Rust, TypeScript, and Python contract projections
    cmds:
      - '{{.RUNNER}} mvp-contracts'

  mvp:contracts-check:
    desc: Verify contract drift and shared fixtures across all languages
    cmds:
      - '{{.RUNNER}} mvp-contracts-check'

  mvp:format:
    desc: Check Rust, TypeScript, and Python formatting
    cmds:
      - '{{.RUNNER}} mvp-format'

  mvp:lint:
    desc: Lint the Rust, TypeScript, and Python workspaces
    cmds:
      - '{{.RUNNER}} mvp-lint'

  mvp:test:
    desc: Build and test all MVP workspace scaffolds
    cmds:
      - '{{.RUNNER}} mvp-test'

  site:
    desc: Build and stage the Pages publication locally
    cmds:
      - '{{.RUNNER}} site'

  check-site:
    desc: Build, stage, and validate the Pages publication
    cmds:
      - '{{.RUNNER}} check-site'

  preview:
    desc: Build and serve the complete local publication preview
    cmds:
      - '{{.RUNNER}} preview'

  live-check:
    desc: Verify canonical routes against the checked-out merged revision
    cmds:
      - '{{.RUNNER}} live-check'

  test:
    desc: Run Antidote publication contract tests
    cmds:
      - '{{.RUNNER}} test'

  beacon:validate:
    desc: Validate the pinned upstream Beacon profile
    cmds:
      - '{{.PYTHON}} scripts/beacon.py validate'

  beacon:doctor:
    desc: Inspect optional Beacon tool requirements
    cmds:
      - '{{.PYTHON}} scripts/beacon.py doctor'

  beacon:plan:
    desc: Print the optional Beacon execution plan
    cmds:
      - '{{.PYTHON}} scripts/beacon.py plan'

  beacon:build:
    desc: Build transactionally through the optional Beacon control plane
    cmds:
      - '{{.PYTHON}} scripts/beacon.py build'

  beacon:package:
    desc: Create a checksummed Beacon distribution package
    cmds:
      - '{{.PYTHON}} scripts/beacon.py package'
