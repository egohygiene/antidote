name: Research paper

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "research-paper-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build-and-check:
    name: Build and check (${{ matrix.theme }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        theme:
          - neutral
          - egohygiene
    steps:
      - name: Harden runner
        # step-security/harden-runner v2.21.0
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c
        with:
          egress-policy: audit

      - name: Check out complete source history
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install publication dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            latexmk \
            librsvg2-bin \
            lmodern \
            pandoc \
            poppler-utils \
            texlive-fonts-recommended \
            texlive-latex-base \
            texlive-latex-extra \
            texlive-latex-recommended \
            texlive-pictures

      - name: Build and validate through pinned Beacon
        shell: bash
        env:
          THEME: "${{ matrix.theme }}"
        run: |
          set -euo pipefail
          make check THEME="${THEME}"

      - name: Upload review artifacts
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: "antidote-paper-${{ matrix.theme }}-${{ github.sha }}"
          path: "build/${{ matrix.theme }}"
          if-no-files-found: error
          retention-days: 30
          compression-level: 9
