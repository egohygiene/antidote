name: GitHub Pages

on:
  pull_request:
    paths:
      - ".github/workflows/pages.yml"
      - "beacon-project.toml"
      - "beacon-template.toml"
      - "docs/**"
      - "latex/**"
      - "paper/**"
      - "scripts/**"
      - "tests/**"
      - "themes/**"
      - "web/**"
      - "Makefile"
      - "Taskfile.yml"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/pages.yml"
      - "beacon-project.toml"
      - "beacon-template.toml"
      - "docs/**"
      - "latex/**"
      - "paper/**"
      - "scripts/**"
      - "tests/**"
      - "themes/**"
      - "web/**"
      - "Makefile"
      - "Taskfile.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    name: Build Pages artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Harden runner
        # step-security/harden-runner v2.21.0
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c
        with:
          egress-policy: audit

      - name: Check out complete source history
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install the pinned Task runner
        # go-task/setup-task v1
        uses: go-task/setup-task@70f2430ad412f838533de8c0515c749ffb2b8bd3
        with:
          version: "3.53.1"

      - name: Install publication dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            latexmk \
            librsvg2-bin \
            lmodern \
            pandoc \
            poppler-utils \
            texlive-fonts-recommended \
            texlive-latex-base \
            texlive-latex-extra \
            texlive-latex-recommended \
            texlive-pictures

      - name: Build and validate publication site
        env:
          PAGES_CUSTOM_DOMAIN: "${{ vars.PAGES_CUSTOM_DOMAIN }}"
        run: task check-site THEME="egohygiene" BUILD_DIR="build/egohygiene"

      - name: Prove publication artifact reproducibility
        run: task reproducibility THEME="egohygiene" BUILD_DIR="build/egohygiene"

      - name: Upload reviewable Pages artifact
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: "antidote-pages-${{ github.sha }}"
          path: "_site"
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
          compression-level: 9

  deploy:
    name: Deploy Pages
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main' &&
      vars.PAGES_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: "${{ steps.deployment.outputs.page_url }}"
    steps:
      - name: Harden runner
        # step-security/harden-runner v2.21.0
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c
        with:
          egress-policy: audit

      - name: Download reviewed Pages artifact
        # actions/download-artifact v8.0.1
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: "antidote-pages-${{ github.sha }}"
          path: "_site"

      - name: Configure GitHub Pages
        # actions/configure-pages v6
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d

      - name: Upload deployable Pages artifact
        # actions/upload-pages-artifact v5
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: "_site"

      - name: Deploy GitHub Pages
        id: deployment
        # actions/deploy-pages v5
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128

      - name: Verify published routes
        shell: bash
        env:
          DEPLOYED_URL: "${{ steps.deployment.outputs.page_url }}"
          EXPECTED_REVISION: "${{ github.sha }}"
        run: |
          set -euo pipefail
          printf "GitHub reported deployment URL <%s>\n" "${DEPLOYED_URL}"
          base_url="$(python3 - <<'PY'
          import json
          import pathlib

          catalog = json.loads(pathlib.Path("_site/site.json").read_text(encoding="utf-8"))
          print(catalog["canonical_url"])
          PY
          )"
          base_url="${base_url%/}/"
          deployed_url="${DEPLOYED_URL%/}/"
          if [[ "${deployed_url}" != "${base_url}" ]]; then
            printf "Expected deployment URL <%s>, received <%s>\n" \
              "${base_url}" "${deployed_url}" >&2
            exit 1
          fi
          for route in \
            "" \
            "paper/" \
            "antidote.pdf" \
            "magazine/" \
            "downloads/" \
            "publication.json" \
            "site.json" \
            "provenance.json" \
            "SHA256SUMS"
          do
            url="${base_url}${route}"
            printf "Checking <%s>\n" "${url}"
            curl \
              --fail \
              --location \
              --output /dev/null \
              --retry 12 \
              --retry-all-errors \
              --retry-delay 10 \
              --silent \
              --show-error \
              "${url}"
          done

          site_catalog="$(mktemp)"
          publication_manifest="$(mktemp)"
          checksum_manifest="$(mktemp)"
          curl --fail --location --silent --show-error \
            "${base_url}site.json" --output "${site_catalog}"
          curl --fail --location --silent --show-error \
            "${base_url}publication.json" --output "${publication_manifest}"
          curl --fail --location --silent --show-error \
            "${base_url}SHA256SUMS" --output "${checksum_manifest}"
          python3 - \
            "${site_catalog}" \
            "${publication_manifest}" \
            "${checksum_manifest}" \
            "${base_url}" \
            "${EXPECTED_REVISION}" <<'PY'
          import hashlib
          import json
          import pathlib
          import sys

          catalog = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          publication = json.loads(
              pathlib.Path(sys.argv[2]).read_text(encoding="utf-8")
          )
          checksum_lines = pathlib.Path(sys.argv[3]).read_text(encoding="utf-8")
          expected_url = sys.argv[4]
          expected_revision = sys.argv[5]
          slots = {slot["id"]: slot for slot in catalog["slots"]}

          checksums = {
              relative: digest
              for digest, relative in (
                  line.split("  ", 1) for line in checksum_lines.splitlines()
              )
          }
          for relative, path in (
              ("site.json", pathlib.Path(sys.argv[1])),
              ("publication.json", pathlib.Path(sys.argv[2])),
          ):
              observed = hashlib.sha256(path.read_bytes()).hexdigest()
              assert checksums[relative] == observed

          assert catalog["canonical_url"] == expected_url
          assert publication["pages_url"] == expected_url
          assert catalog["source_revision"] == expected_revision
          assert publication["source_revision"] == expected_revision
          assert slots["paper"]["status"] == "available"
          assert slots["magazine"]["status"] == "planned"
          assert slots["magazine"]["artifacts"] == []
          assert slots["magazine"]["manifest_path"] is None
          PY
