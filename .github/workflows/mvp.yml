name: MVP foundation

on:
  pull_request:
    paths:
      - ".github/workflows/mvp.yml"
      - "apps/**"
      - "contracts/**"
      - "crates/**"
      - "scripts/generate_contracts.py"
      - "scripts/mvp.py"
      - "scripts/tasks.py"
      - "workers/**"
      - ".node-version"
      - ".gitignore"
      - "Cargo.lock"
      - "Cargo.toml"
      - "Makefile"
      - "Taskfile.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "rust-toolchain.toml"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/mvp.yml"
      - "apps/**"
      - "contracts/**"
      - "crates/**"
      - "scripts/generate_contracts.py"
      - "scripts/mvp.py"
      - "scripts/tasks.py"
      - "workers/**"
      - ".node-version"
      - ".gitignore"
      - "Cargo.lock"
      - "Cargo.toml"
      - "Makefile"
      - "Taskfile.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "rust-toolchain.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "mvp-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  application-foundation:
    name: Application foundation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Harden runner
        # step-security/harden-runner v2.21.0
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c
        with:
          egress-policy: audit

      - name: Check out complete source history
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned pnpm
        # pnpm/action-setup v4
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          run_install: false
          version: "11.19.0"

      - name: Install pinned Node
        # actions/setup-node v6
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: ".node-version"
          cache: pnpm
          cache-dependency-path: "pnpm-lock.yaml"

      - name: Install pinned uv
        # astral-sh/setup-uv v7
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: "0.11.33"
          enable-cache: true
          cache-dependency-glob: "workers/generation/uv.lock"

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "1.97.1" \
            --profile minimal \
            --component clippy \
            --component rustfmt

      - name: Cache Rust dependencies
        # Swatinem/rust-cache v2
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: ". -> target"

      - name: Install Tauri Linux prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            build-essential \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            pkg-config

      - name: Restore pinned MVP workspaces
        run: make mvp-bootstrap

      - name: Validate the complete MVP foundation
        run: make mvp-check
