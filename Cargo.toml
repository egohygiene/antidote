[workspace]
resolver = "2"
members = [
  "apps/desktop/src-tauri",
  "crates/antidote-audio",
  "crates/antidote-contracts",
  "crates/antidote-core",
  "crates/antidote-provenance",
  "crates/antidote-store",
]

[workspace.package]
authors = ["Ego Hygiene"]
edition = "2024"
license = "MIT"
repository = "https://github.com/egohygiene/antidote"
rust-version = "1.97.1"
version = "0.1.0"

[workspace.dependencies]
jsonschema = { version = "=0.52.0", default-features = false }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tauri = { version = "=2.11.5" }
tauri-build = { version = "=2.6.3" }

[workspace.lints.rust]
missing_debug_implementations = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
