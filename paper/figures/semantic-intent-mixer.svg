  <text x="92" y="607" class="body-strong" text-anchor="start" >FAMILIARITY</text>
  <text x="520" y="607" class="small" text-anchor="end" >known textures</text>
  <line x1="96" y1="635" x2="510" y2="635" stroke="#a7b2bd" stroke-width="10" stroke-linecap="round"/>
  <line x1="96" y1="635" x2="342" y2="635" stroke="#aa6c00" stroke-width="10" stroke-linecap="round"/>
