  <text x="520" y="712" class="small" text-anchor="end" >open · spacious</text>
  <line x1="96" y1="740" x2="510" y2="740" stroke="#a7b2bd" stroke-width="10" stroke-linecap="round"/>
  <line x1="96" y1="740" x2="391" y2="740" stroke="#aa6c00" stroke-width="10" stroke-linecap="round"/>
