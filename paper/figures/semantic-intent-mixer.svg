  <rect x="625" y="145" width="410" height="730" rx="20" class="card-violet" />
  <text x="830" y="198" class="section" text-anchor="middle" >TYPED COMPOSITION</text>
  <rect x="685" y="240" width="290" height="44" rx="22" class="pill-violet" />
<text x="830.0" y="270" class="pill-text-violet" text-anchor="middle" style="font-size:17px">VISIBLE AUTHORITY ORDER</text>
  <text x="680" y="322" class="body" text-anchor="start" ><tspan x="680" dy="0">1  current user value</tspan><tspan x="680" dy="48">2  accepted suggestion</tspan><tspan x="680" dy="48">3  neutral default</tspan></text>
  <text x="830" y="500" class="equation" text-anchor="middle" style="font-size:25px">αⱼ,ₜ = (1−ρⱼ)αⱼ,ₜ₋₁ + ρⱼkᵉᶠᶠⱼ,ₜ</text>
  <text x="830" y="540" class="small" text-anchor="middle" >ordinary controls only</text>
  <text x="680" y="614" class="body" text-anchor="start" ><tspan x="680" dy="0">Ξ  exclusions + safety</tspan><tspan x="680" dy="48">≺  conflict priority</tspan><tspan x="680" dy="48">mⱼ  versioned mixin</tspan><tspan x="680" dy="48">⊕  typed composition</tspan></text>
  <rect x="690" y="797" width="280" height="44" rx="22" class="pill-plum" />
<text x="830.0" y="827" class="pill-text-plum" text-anchor="middle" style="font-size:17px">INSPECT · EDIT · REJECT</text>
  <rect x="1085" y="145" width="470" height="305" rx="20" class="card-blue" />
  <text x="1320" y="198" class="section-blue" text-anchor="middle" >CONDITIONING STATE</text>
  <text x="1135" y="266" class="body" text-anchor="start" ><tspan x="1135" dy="0">resolved semantic condition qᵢ,ₙ</tspan><tspan x="1135" dy="58">constraints + uncertainty</tspan><tspan x="1135" dy="58">provenance + adapter capabilities</tspan></text>
  <rect x="1085" y="505" width="470" height="370" rx="20" class="card-teal" />
  <text x="1320" y="558" class="section-blue" text-anchor="middle" >APPROVED COMPILATION</text>
  <text x="1135" y="625" class="body" text-anchor="start" ><tspan x="1135" dy="0">journey plan Jᵢ,ₜ</tspan><tspan x="1135" dy="54">↓ capability-bounded Compileₐ</tspan><tspan x="1135" dy="54">conditioning γ⁽ᵃ⁾ᵢ,ₙ</tspan><tspan x="1135" dy="54">optional native prompt φ⁽ᵃ⁾ᵢ,ₙ</tspan></text>
  <rect x="1178" y="799" width="284" height="44" rx="22" class="pill-gold" />
<text x="1320.0" y="829" class="pill-text-gold" text-anchor="middle" style="font-size:17px">HUMAN APPROVAL GATE</text>
  <path d="M575 510 H613" class="flow-gold" marker-end="url(#arrow-gold)" data-flow="controls-to-mixer"/>
  <path d="M1035 330 H1073" class="flow" marker-end="url(#arrow-navy)" data-flow="mixer-to-conditioning"/>
  <path d="M1320 450 V493" class="flow-gold" marker-end="url(#arrow-gold)" data-flow="approval-to-compilation"/>
  <text x="800" y="945" class="footer" text-anchor="middle" >A MIXIN CAN GUIDE A MODEL ADAPTER; IT DOES NOT DIRECTLY CONTROL ACOUSTICS, EMOTION, OR BENEFIT</text>
