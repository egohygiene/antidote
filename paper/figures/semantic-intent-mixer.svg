  <text x="520" y="502" class="small" text-anchor="end" >soft · not dark</text>
  <line x1="96" y1="530" x2="510" y2="530" stroke="#a7b2bd" stroke-width="10" stroke-linecap="round"/>
  <line x1="96" y1="530" x2="230" y2="530" stroke="#aa6c00" stroke-width="10" stroke-linecap="round"/>
