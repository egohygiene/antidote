  <rect width="1600" height="1000" fill="#fffaf6"/>
  <text x="800" y="62" class="title" text-anchor="middle" >SEMANTIC INTENT MIXER</text>
  <text x="800" y="100" class="subtitle" text-anchor="middle" >Human-scale controls become typed, reversible conditioning — not hidden prompt concatenation</text>
  <rect x="45" y="145" width="530" height="730" rx="20" class="card-gold" />
  <text x="310" y="198" class="section" text-anchor="middle" style="font-size:26px">PERSON-AUTHORED CONTROLS</text>
  <text x="310" y="232" class="small" text-anchor="middle" >illustrative positions · not response data</text>
  <text x="92" y="292" class="body-strong" text-anchor="start" >GROUNDING</text>
  <text x="520" y="292" class="small" text-anchor="end" >steady · embodied</text>
