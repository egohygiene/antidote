<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="850" viewBox="0 0 1800 850" role="img" aria-labelledby="title description" data-antidote-state="final" data-antidote-generator="scripts/generate_publication_figures.py" data-visual-id="ANT-FIG-005">
  <title id="title">State estimation, predictive horizon, and generate-ahead buffer</title>
  <desc id="description">A time axis shows the current playback cursor, verified buffered audio, generation in progress, and a future planning horizon. Above it, an uncertain state belief is corrected by the person before the next plan is accepted. Deadline and safety margins are marked independently from claims about subjective response or model quality.</desc>
