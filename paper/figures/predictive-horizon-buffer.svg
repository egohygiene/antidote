<text x="900.5" y="788" class="pill-text-violet" text-anchor="middle" >Bᵢ,ₜ ≥ ℓₒᵦₛₑᵣᵥₑ + ℓₚₗₐₙ + ℓgₑₙₑᵣₐₜₑ + ℓᵥₑᵣᵢfᵧ + ℓₛcₕₑdᵤₗₑ + Mᵢ,ₜ</text>
