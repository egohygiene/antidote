  <text x="95" y="410" class="section-blue" text-anchor="start" >2  MUSICAL + ACOUSTIC BOUNDARY</text>
  <text x="110" y="470" class="body" text-anchor="start" ><tspan x="110" dy="0">tempo + beat phase</tspan><tspan x="110" dy="42">key / chord compatibility</tspan><tspan x="110" dy="42">loudness + spectral balance</tspan></text>
  <text x="650" y="470" class="body" text-anchor="start" ><tspan x="650" dy="0">timbre + density</tspan><tspan x="650" dy="42">phrase alignment</tspan><tspan x="650" dy="42">artifact + analyzer versions</tspan></text>
