  <text x="1395" y="490" class="equation" text-anchor="middle" style="font-size:24px">Dᵃᶜₙ = Σᵣ∈𝓕 wᵣ dᵣ(fᵣ(aᵗᵃⁱˡₙ), fᵣ(aʰᵉᵃᵈₙ₊₁))</text>
  <text x="1395" y="535" class="small" text-anchor="middle" >normalized measured features · threshold requires evaluation</text>
