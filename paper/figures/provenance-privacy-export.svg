<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1050" viewBox="0 0 1700 1050" role="img" aria-labelledby="title description" data-antidote-state="final" data-antidote-generator="scripts/generate_publication_figures.py" data-visual-id="ANT-FIG-007">
  <title id="title">Provenance, privacy review, and fail-closed export</title>
  <desc id="description">Versioned session events, model identity, control records, exposure, response, and artifact hashes feed an export candidate. Four gates check purpose and consent scope, excluded or sensitive fields, privacy review, and explicit human approval. Any failed or unresolved gate stops export and records the reason; a successful path emits a manifest and checksums without asserting truth or safety.</desc>
  <defs>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7650d8"/>
      <stop offset="0.45" stop-color="#277bc0"/>
      <stop offset="0.75" stop-color="#1b9f9a"/>
      <stop offset="1" stop-color="#c88018"/>
    </linearGradient>
    <pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="14" stroke="#8a78d5" stroke-width="4" opacity="0.28"/>
    </pattern>
    <marker id="arrow-navy" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L18 9 L0 18 Z" fill="#17375e"/>
    </marker>
    <marker id="arrow-violet" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L18 9 L0 18 Z" fill="#5742cf"/>
    </marker>
    <marker id="arrow-plum" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L18 9 L0 18 Z" fill="#98245f"/>
    </marker>
    <marker id="arrow-gold" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L18 9 L0 18 Z" fill="#aa6c00"/>
    </marker>
    <style>
      text { font-family: "DejaVu Sans Condensed", "DejaVu Sans", Arial, sans-serif; }
      .title { font-size: 48px; font-weight: 800; letter-spacing: 0.015em; fill: #142b4b; }
      .subtitle { font-size: 27px; font-weight: 500; fill: #465970; }
      .section { font-size: 31px; font-weight: 800; letter-spacing: 0.018em; fill: #291542; }
      .section-blue { font-size: 31px; font-weight: 800; letter-spacing: 0.018em; fill: #15375e; }
      .card { fill: #fffdfa; stroke: #17375e; stroke-width: 4; }
      .card-violet { fill: #f8f5ff; stroke: #5742cf; stroke-width: 4; }
      .card-gold { fill: #fff5dc; stroke: #aa6c00; stroke-width: 4; }
      .card-plum { fill: #fff4f8; stroke: #98245f; stroke-width: 4; }
      .card-blue { fill: #eef8fd; stroke: #277bc0; stroke-width: 4; }
      .card-teal { fill: #effaf7; stroke: #167f78; stroke-width: 4; }
      .card-muted { fill: #f4f1ed; stroke: #68798c; stroke-width: 4; stroke-dasharray: 12 8; }
      .head { font-size: 31px; font-weight: 800; fill: #142b4b; }
      .body { font-size: 25px; font-weight: 500; fill: #354b64; }
      .body-strong { font-size: 25px; font-weight: 750; fill: #17375e; }
      .small { font-size: 21px; font-weight: 550; fill: #52667c; }
      .tiny { font-size: 18px; font-weight: 600; fill: #52667c; }
      .equation { font-size: 29px; font-weight: 650; fill: #291542; }
      .flow { fill: none; stroke: #17375e; stroke-width: 5; stroke-linejoin: round; }
      .flow-violet { fill: none; stroke: #5742cf; stroke-width: 5; stroke-dasharray: 13 9; stroke-linejoin: round; }
      .flow-plum { fill: none; stroke: #98245f; stroke-width: 5; stroke-linejoin: round; }
      .flow-gold { fill: none; stroke: #aa6c00; stroke-width: 6; stroke-linejoin: round; }
      .boundary { fill: none; stroke: #64768a; stroke-width: 3; stroke-dasharray: 12 9; }
      .pill { fill: #e6eef7; stroke: #17375e; stroke-width: 2; }
      .pill-violet { fill: #eeeaff; stroke: #5742cf; stroke-width: 2; }
      .pill-gold { fill: #ffedbd; stroke: #aa6c00; stroke-width: 2; }
      .pill-plum { fill: #ffe8f1; stroke: #98245f; stroke-width: 2; }
      .pill-teal { fill: #e2f5ef; stroke: #167f78; stroke-width: 2; }
      .pill-text { font-size: 21px; font-weight: 800; fill: #17375e; letter-spacing: 0.015em; }
      .pill-text-violet { font-size: 21px; font-weight: 800; fill: #4b37bb; letter-spacing: 0.015em; }
      .pill-text-gold { font-size: 21px; font-weight: 800; fill: #795000; letter-spacing: 0.015em; }
      .pill-text-plum { font-size: 21px; font-weight: 800; fill: #8d1f58; letter-spacing: 0.015em; }
      .footer { font-size: 22px; font-weight: 800; fill: #52667c; letter-spacing: 0.02em; }
    </style>
  </defs>
  <rect width="1700" height="1050" fill="#fffaf6"/>
  <text x="850" y="58" class="title" text-anchor="middle" >PROVENANCE + PRIVACY-REVIEWED EXPORT</text>
  <text x="850" y="96" class="subtitle" text-anchor="middle" >Integrity records become shareable only after four explicit human-governed gates</text>
  <rect x="45" y="140" width="360" height="720" rx="20" class="card-blue" />
  <text x="225" y="194" class="section-blue" text-anchor="middle" >SESSION LINEAGE</text>
  <text x="90" y="260" class="body" text-anchor="start" ><tspan x="90" dy="0">event IDs + versions</tspan><tspan x="90" dy="64">consent + projection</tspan><tspan x="90" dy="64">plan + specification hash</tspan><tspan x="90" dy="64">model + adapter identity</tspan><tspan x="90" dy="64">artifact + feature report</tspan><tspan x="90" dy="64">exposure + interruption</tspan><tspan x="90" dy="64">response + correction</tspan></text>
  <rect x="95" y="760" width="260" height="44" rx="22" class="pill-violet" />
<text x="225.0" y="790" class="pill-text-violet" text-anchor="middle" >EXPORT CANDIDATE</text>
  <rect x="465" y="140" width="770" height="720" rx="20" class="card-gold" />
  <text x="850" y="194" class="section" text-anchor="middle" >FAIL-CLOSED REVIEW PIPELINE</text>
  <rect x="530" y="225" width="640" height="92" rx="16" class="card-gold" data-gate="1"/>
  <circle cx="575" cy="271" r="27" fill="#aa6c00"/>
  <text x="575" y="281" class="body-strong" text-anchor="middle" style="fill:#fffaf6">1</text>
  <text x="625" y="264" class="head" text-anchor="start" style="font-size:27px">PURPOSE + CONSENT</text>
  <text x="625" y="297" class="small" text-anchor="start" >destination and action allowed</text>
  <text x="1118" y="280" class="tiny" text-anchor="end" >PASS / FAIL / UNRESOLVED</text>
  <path d="M850 317 V353" class="flow-gold" marker-end="url(#arrow-gold)" data-flow="gate-1-next"/>
  <path d="M1170 271 H1265" class="flow-plum" marker-end="url(#arrow-plum)" data-flow="gate-1-blocked"/>
  <rect x="530" y="365" width="640" height="92" rx="16" class="card-gold" data-gate="2"/>
  <circle cx="575" cy="411" r="27" fill="#aa6c00"/>
  <text x="575" y="421" class="body-strong" text-anchor="middle" style="fill:#fffaf6">2</text>
  <text x="625" y="404" class="head" text-anchor="start" style="font-size:27px">MINIMIZE + REDACT</text>
  <text x="625" y="437" class="small" text-anchor="start" >exclude sensitive payloads</text>
  <text x="1118" y="420" class="tiny" text-anchor="end" >PASS / FAIL / UNRESOLVED</text>
  <path d="M850 457 V493" class="flow-gold" marker-end="url(#arrow-gold)" data-flow="gate-2-next"/>
  <path d="M1170 411 H1265" class="flow-plum" marker-end="url(#arrow-plum)" data-flow="gate-2-blocked"/>
  <rect x="530" y="505" width="640" height="92" rx="16" class="card-gold" data-gate="3"/>
  <circle cx="575" cy="551" r="27" fill="#aa6c00"/>
  <text x="575" y="561" class="body-strong" text-anchor="middle" style="fill:#fffaf6">3</text>
  <text x="625" y="544" class="head" text-anchor="start" style="font-size:27px">PRIVACY REVIEW</text>
  <text x="625" y="577" class="small" text-anchor="start" >re-identification unresolved?</text>
  <text x="1118" y="560" class="tiny" text-anchor="end" >PASS / FAIL / UNRESOLVED</text>
  <path d="M850 597 V633" class="flow-gold" marker-end="url(#arrow-gold)" data-flow="gate-3-next"/>
  <path d="M1170 551 H1265" class="flow-plum" marker-end="url(#arrow-plum)" data-flow="gate-3-blocked"/>
  <rect x="530" y="645" width="640" height="92" rx="16" class="card-gold" data-gate="4"/>
  <circle cx="575" cy="691" r="27" fill="#aa6c00"/>
  <text x="575" y="701" class="body-strong" text-anchor="middle" style="fill:#fffaf6">4</text>
  <text x="625" y="684" class="head" text-anchor="start" style="font-size:27px">HUMAN APPROVAL</text>
  <text x="625" y="717" class="small" text-anchor="start" >exact files and destination</text>
  <text x="1118" y="700" class="tiny" text-anchor="end" >PASS / FAIL / UNRESOLVED</text>
  <path d="M1170 691 H1265" class="flow-plum" marker-end="url(#arrow-plum)" data-flow="gate-4-blocked"/>
  <path d="M405 800 H453" class="flow" marker-end="url(#arrow-navy)" data-flow="candidate-to-review"/>
  <rect x="1280" y="185" width="360" height="430" rx="20" class="card-plum" />
  <text x="1460" y="238" class="section" text-anchor="middle" >BLOCKED EXPORT</text>
  <text x="1325" y="305" class="body" text-anchor="start" ><tspan x="1325" dy="0">no partial release</tspan><tspan x="1325" dy="55">record failed gate</tspan><tspan x="1325" dy="55">preserve review reason</tspan><tspan x="1325" dy="55">return to human</tspan><tspan x="1325" dy="55">do not infer permission</tspan></text>
  <rect x="1335" y="540" width="250" height="44" rx="22" class="pill-plum" />
<text x="1460.0" y="570" class="pill-text-plum" text-anchor="middle" >NO BYPASS</text>
  <rect x="1280" y="665" width="360" height="195" rx="20" class="card-teal" />
  <text x="1460" y="716" class="section-blue" text-anchor="middle" style="font-size:27px">APPROVED PACKAGE</text>
  <text x="1325" y="765" class="body" text-anchor="start" ><tspan x="1325" dy="0">manifest + checksums</tspan><tspan x="1325" dy="37">declared exclusions</tspan><tspan x="1325" dy="37">provenance summary</tspan></text>
  <path d="M1170 691 H1268" class="flow-gold" marker-end="url(#arrow-gold)" data-flow="approval-to-package"/>
  <rect x="310" y="905" width="1080" height="90" rx="18" class="card-muted" />
  <text x="850" y="943" class="head" text-anchor="middle" style="font-size:28px">HASHES SUPPORT IDENTITY + DRIFT DETECTION</text>
  <text x="850" y="978" class="small" text-anchor="middle" >They do not prove truth, authorship, consent, privacy, ownership, safety, or benefit</text>
</svg>
