  <rect width="1200" height="440" fill="#fffaf6"/>
  <text x="600" y="48" class="title" text-anchor="middle" style="font-size:38px">PERSON + MOMENT → JOURNEY → AUDIO → RESPONSE</text>
  <text x="600" y="80" class="subtitle" text-anchor="middle" >A governed chain of records — not a causal or therapeutic mechanism</text>
  <g data-node="step-1">
  <rect x="55" y="110" width="235" height="170" rx="20" class="card-gold" />
  <text x="81" y="146" class="body-strong" text-anchor="start" >1</text>
  <text x="173" y="177" class="head" text-anchor="middle" style="font-size:18px">PERSON + MOMENT</text>
  <text x="173" y="218" class="body" text-anchor="middle" style="font-size:21px"><tspan x="173" dy="0">chosen context</tspan><tspan x="173" dy="31">desired direction</tspan></text>
  </g>
  <g data-node="step-2">
  <rect x="340" y="110" width="235" height="170" rx="20" class="card-violet" />
  <text x="366" y="146" class="body-strong" text-anchor="start" >2</text>
  <text x="458" y="177" class="head" text-anchor="middle" style="font-size:18px">SEMANTIC JOURNEY</text>
  <text x="458" y="218" class="body" text-anchor="middle" style="font-size:21px"><tspan x="458" dy="0">intent + stages</tspan><tspan x="458" dy="31">constraints + approval</tspan></text>
  </g>
  <g data-node="step-3">
  <rect x="625" y="110" width="235" height="170" rx="20" class="card-blue" />
  <text x="651" y="146" class="body-strong" text-anchor="start" >3</text>
  <text x="743" y="177" class="head" text-anchor="middle" style="font-size:18px">ACOUSTIC REALIZATION</text>
  <text x="743" y="218" class="body" text-anchor="middle" style="font-size:21px"><tspan x="743" dy="0">artifact + hash</tspan><tspan x="743" dy="31">measured features</tspan></text>
  </g>
  <g data-node="step-4">
  <rect x="910" y="110" width="235" height="170" rx="20" class="card-teal" />
  <text x="936" y="146" class="body-strong" text-anchor="start" >4</text>
  <text x="1028" y="177" class="head" text-anchor="middle" style="font-size:18px">EXPOSURE + RESPONSE</text>
  <text x="1028" y="218" class="body" text-anchor="middle" style="font-size:21px"><tspan x="1028" dy="0">what was heard</tspan><tspan x="1028" dy="31">what was reported</tspan></text>
  </g>
  <path d="M290 195 H328" class="flow" marker-end="url(#arrow-navy)" data-relation="proposed-test"/>
  <path d="M575 195 H613" class="flow" marker-end="url(#arrow-navy)" data-relation="proposed-test"/>
  <path d="M860 195 H898" class="flow" marker-end="url(#arrow-navy)" data-relation="proposed-test"/>
  <path d="M1025 286 V326 H180 V286" class="flow-violet" marker-end="url(#arrow-violet)" data-relation="future-advisory-proposal"/>
  <rect x="380" y="316" width="440" height="44" rx="22" class="pill-violet" />
<text x="600.0" y="346" class="pill-text-violet" text-anchor="middle" >FUTURE ADVISORY PROPOSAL</text>
  <text x="600" y="392" class="footer" text-anchor="middle" style="font-size:18px">Human review required · no automatic learning · every transition remains a hypothesis to test</text>
</svg>
