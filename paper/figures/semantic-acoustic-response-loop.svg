<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title description" data-antidote-state="final" data-antidote-generator="scripts/generate_publication_figures.py" data-visual-id="ANT-FIG-001">
  <title id="title">Person-moment-journey response model</title>
  <desc id="description">Four numbered cards run left to right. Person and moment holds chosen context and desired direction; semantic journey holds intent, stages, constraints, and approval; acoustic realization holds the content-hashed artifact and measured features; exposure and response distinguishes what was heard from what was reported. A separate dashed return path is labeled future advisory proposal, human review required, and no automatic learning. Every forward transition is a proposed relationship to test rather than a causal or therapeutic mechanism.</desc>
  <defs>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7650d8"/>
      <stop offset="0.45" stop-color="#277bc0"/>
      <stop offset="0.75" stop-color="#1b9f9a"/>
      <stop offset="1" stop-color="#c88018"/>
    </linearGradient>
    <pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="14" stroke="#8a78d5" stroke-width="4" opacity="0.28"/>
    </pattern>
    <marker id="arrow-navy" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L18 9 L0 18 Z" fill="#17375e"/>
    </marker>
    <marker id="arrow-violet" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L18 9 L0 18 Z" fill="#5742cf"/>
    </marker>
    <marker id="arrow-plum" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L18 9 L0 18 Z" fill="#98245f"/>
    </marker>
    <marker id="arrow-gold" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L18 9 L0 18 Z" fill="#aa6c00"/>
    </marker>
