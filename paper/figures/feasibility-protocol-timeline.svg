  <text x="255" y="502" class="head" text-anchor="middle" style="font-size:28px"><tspan x="255" dy="0">REVIEW +</tspan><tspan x="255" dy="35">CLOSE / PAUSE</tspan></text>
  <text x="255" y="582" class="small" text-anchor="middle" style="font-size:20px">safety · corrections · no update</text>
  </g>
