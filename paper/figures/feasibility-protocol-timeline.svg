  <rect x="1250" y="666" width="480" height="78" rx="16" class="card-violet" />
  <text x="1490" y="700" class="head" text-anchor="middle" style="font-size:26px">NEXT EXPOSURE ≥ 48 HOURS</text>
  <text x="1490" y="730" class="small" text-anchor="middle" >later window must close first</text>
  <text x="900" y="790" class="footer" text-anchor="middle" >ORDERED DESIGN ≠ COMPLETED STUDY · NO PARTICIPANT FLOW OR OUTCOME IS SHOWN</text>
