  <text x="255" y="227" class="head" text-anchor="middle" style="font-size:28px"><tspan x="255" dy="0">AUTHORITY +</tspan><tspan x="255" dy="35">READINESS</tspan></text>
  <text x="255" y="307" class="small" text-anchor="middle" style="font-size:20px">consent · setting · choice</text>
  </g>
  <g data-stage-order="2" data-stage="baseline">
