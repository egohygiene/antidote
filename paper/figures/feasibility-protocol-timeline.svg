  <rect x="1360" y="165" width="370" height="170" rx="18" class="card-blue" />
  <circle cx="1394" cy="199" r="24" fill="#17375e"/>
  <text x="1394" y="208" class="body-strong" text-anchor="middle" style="fill:#fffaf6">4</text>
  <text x="1545" y="227" class="head" text-anchor="middle" style="font-size:28px"><tspan x="1545" dy="0">GENERATE +</tspan><tspan x="1545" dy="35">VERIFY</tspan></text>
  <text x="1545" y="307" class="small" text-anchor="middle" style="font-size:20px">model · seed · hash · features</text>
  </g>
  <g data-stage-order="5" data-stage="explicit">
  <rect x="1360" y="440" width="370" height="170" rx="18" class="card-gold" />
  <circle cx="1394" cy="474" r="24" fill="#17375e"/>
  <text x="1394" y="483" class="body-strong" text-anchor="middle" style="fill:#fffaf6">5</text>
  <text x="1545" y="502" class="head" text-anchor="middle" style="font-size:28px"><tspan x="1545" dy="0">EXPLICIT</tspan><tspan x="1545" dy="35">PLAYBACK</tspan></text>
  <text x="1545" y="582" class="small" text-anchor="middle" style="font-size:20px">separate start · stop always</text>
  </g>
  <g data-stage-order="6" data-stage="immediate">
  <rect x="930" y="440" width="370" height="170" rx="18" class="card-blue" />
  <circle cx="964" cy="474" r="24" fill="#17375e"/>
  <text x="964" y="483" class="body-strong" text-anchor="middle" style="fill:#fffaf6">6</text>
  <text x="1115" y="502" class="head" text-anchor="middle" style="font-size:28px"><tspan x="1115" dy="0">IMMEDIATE</tspan><tspan x="1115" dy="35">RESPONSE</tspan></text>
  <text x="1115" y="582" class="small" text-anchor="middle" style="font-size:20px">within 5 min · separated fields</text>
  </g>
  <g data-stage-order="7" data-stage="later">
