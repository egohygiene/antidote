<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100" role="img" aria-labelledby="title description" data-antidote-state="final" data-antidote-generator="scripts/generate_publication_figures.py" data-visual-id="ANT-FIG-009">
  <title id="title">Moment, journey, and decision equation map</title>
  <desc id="description">Six cards cover all 16 registered equations. They separate moment and authorized context; semantic mixing and model-specific adaptation; uncertain state belief and a negotiated planning horizon; buffer and independent semantic, acoustic, and waveform continuity; exposure-linked response; and a future within-person update. Each card states its epistemic class and implementation status. Dashed arrows show record dependencies rather than established causality, and the final warning rejects any reading of the equations as validated affect laws, optimal policies, or authorization for autonomous learning.</desc>
