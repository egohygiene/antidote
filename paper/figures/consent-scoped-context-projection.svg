  <rect width="1600" height="900" fill="#fffaf6"/>
  <text x="800" y="64" class="title" text-anchor="middle" >CONSENT-SCOPED CONTEXT PROJECTION</text>
  <text x="800" y="102" class="subtitle" text-anchor="middle" >The model sees a reviewed purpose-bounded projection — never unrestricted history</text>
  <rect x="45" y="150" width="320" height="555" rx="20" class="card-plum" />
  <text x="205" y="202" class="section" text-anchor="middle" >PRIVATE CONTEXT</text>
  <text x="90" y="258" class="body" text-anchor="start" ><tspan x="90" dy="0">Manual check-in</tspan><tspan x="90" dy="64">Selected journal excerpt</tspan><tspan x="90" dy="64">Prior response record</tspan><tspan x="90" dy="64">Optional signal feature</tspan></text>
  <rect x="82" y="548" width="246" height="44" rx="22" class="pill-plum" />
<text x="205.0" y="578" class="pill-text-plum" text-anchor="middle" >SOURCE RECORDS</text>
  <text x="205" y="635" class="body-strong" text-anchor="middle" >Outside worker boundary</text>
  <text x="205" y="672" class="small" text-anchor="middle" >retained separately</text>
  <rect x="430" y="150" width="340" height="555" rx="20" class="card-gold" />
  <text x="600" y="202" class="section" text-anchor="middle" >CONSENT GRANT</text>
  <text x="480" y="258" class="body" text-anchor="start" ><tspan x="480" dy="0">Purpose</tspan><tspan x="480" dy="58">Allowed fields</tspan><tspan x="480" dy="58">Allowed actions</tspan><tspan x="480" dy="58">Expiry + retention</tspan><tspan x="480" dy="58">Review + correction</tspan></text>
  <rect x="478" y="574" width="244" height="44" rx="22" class="pill-gold" />
<text x="600.0" y="604" class="pill-text-gold" text-anchor="middle" >HUMAN AUTHORITY</text>
  <text x="600" y="655" class="body-strong" text-anchor="middle" >missing or stale → block</text>
  <rect x="835" y="150" width="340" height="555" rx="20" class="card-violet" />
  <text x="1005" y="202" class="section" text-anchor="middle" >WORKING PROJECTION</text>
  <text x="885" y="258" class="body" text-anchor="start" ><tspan x="885" dy="0">Minimized semantic items</tspan><tspan x="885" dy="58">Source-event lineage</tspan><tspan x="885" dy="58">Derivation version</tspan><tspan x="885" dy="58">Edits + omissions</tspan><tspan x="885" dy="58">Visible exclusions</tspan></text>
  <rect x="875" y="574" width="260" height="44" rx="22" class="pill-violet" />
<text x="1005.0" y="604" class="pill-text-violet" text-anchor="middle" >REVIEWED FOR USE</text>
  <text x="1005" y="655" class="equation" text-anchor="middle" >cᵂᵒʳᵏᵢ,ₜ = π(Sᶜᵗˣᵢ,ₜ ; Aᵢ,ₜ)</text>
  <rect x="1240" y="150" width="315" height="260" rx="20" class="card-blue" />
  <text x="1398" y="202" class="section-blue" text-anchor="middle" >PLANNING INPUT</text>
  <text x="1285" y="260" class="body" text-anchor="start" ><tspan x="1285" dy="0">journey proposal</tspan><tspan x="1285" dy="54">human correction</tspan><tspan x="1285" dy="54">explicit approval</tspan></text>
  <rect x="1240" y="445" width="315" height="260" rx="20" class="card-teal" />
  <text x="1398" y="497" class="section-blue" text-anchor="middle" >WORKER INPUT</text>
  <text x="1285" y="555" class="body" text-anchor="start" ><tspan x="1285" dy="0">immutable specification</tspan><tspan x="1285" dy="54">approved projection only</tspan><tspan x="1285" dy="54">no database access</tspan></text>
  <path d="M365 330 H418" class="flow-gold" marker-end="url(#arrow-gold)" data-flow="source-to-consent"/>
  <path d="M770 330 H823" class="flow-gold" marker-end="url(#arrow-gold)" data-flow="consent-to-projection"/>
  <path d="M1175 280 H1228" class="flow" marker-end="url(#arrow-navy)" data-flow="projection-to-plan"/>
  <path d="M1398 410 V433" class="flow" marker-end="url(#arrow-navy)" data-flow="approval-to-worker"/>
  <rect x="420" y="754" width="760" height="84" rx="18" class="card-muted" />
  <text x="800" y="790" class="head" text-anchor="middle" style="font-size:27px">EXCLUDED · REVOKED · EXPIRED · OUT OF PURPOSE</text>
  <text x="800" y="821" class="small" text-anchor="middle" >record the reason and stop — no bypass path</text>
  <path d="M600 705 V742" class="flow-plum" marker-end="url(#arrow-plum)" data-flow="consent-failure"/>
  <text x="800" y="878" class="footer" text-anchor="middle" >CONSENT AND LOCAL EXECUTION SUPPORT INSPECTION; THEY DO NOT PROVE PRIVACY OR MEANINGFUL CONSENT</text>
